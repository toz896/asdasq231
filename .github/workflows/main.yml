name: build-milstoz-v2
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compilar VST2 x64
        shell: cmd
        run: build_msvc.bat
      - uses: actions/upload-artifact@v4
        with:
          name: MilsTozMic-Plugin
          path: build/VoiceEQMic.dll
